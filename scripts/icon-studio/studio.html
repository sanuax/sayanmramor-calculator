<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Product icon studio</title>
<link rel="icon" href="data:,">
<style>html, body { margin: 0; background: #111; } canvas { display: block; }</style>
</head>
<body>
<!--
  The calculator's product cards, rendered (the owner, 2026-11-18: «иконки сделаны тяп-ляп»).
  Every product is modelled here in centimetres (y up; the room's back wall is z = 0, its left wall
  x = 0, the floor y = 0) and rendered by three.js with the catalogue's own stone photos, soft
  shadows and one camera for the whole series. scripts/icon-studio/render.py opens this page for
  every product and look and saves the frames.

    studio.html?p=<product key>&w=1440&h=960

  The look is one («Люкс», the owner's pick of several concepts, 2026-11-18): a near-black studio, the
  product on a dark glossy floor, warm LED light built into it where it is really fitted. render.py also
  asks for the passes it composes (window.__pass): the floor's and the mirror's reflections, the glow.
-->
<script type="module">
import * as THREE from '../../vendor/three/three.module.js';

const Q = new URLSearchParams(location.search);
const KEY = Q.get('p') || 'stoleshnitsa_kuhnya';
const W = +Q.get('w') || 1440, H = +Q.get('h') || 960;

// ---------------------------------------------------------------- the look
const L = {
  wall: '#1d1b19', exposure: 1.0,
  key: { color: '#ffe6c8', intensity: 2.7, pos: [-90, 520, 260], angle: 0.45, penumbra: 1.0 },
  fill: { sky: '#8a847a', ground: '#0b0a09', intensity: 0.55 },
  stone: { veins: 1.45, sat: 1.0, gamma: 1.06 },
  rim: { color: '#ffd9ae', intensity: 1.1, pos: [260, 240, -260] },
  front: 0.38, env: 0.85,
};

// ---------------------------------------------------------------- renderer, scene, camera
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = L.exposure;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
{
  // the studio's backdrop: a dark warm glow behind the product, falling off to black at the edges
  const c = document.createElement('canvas'); c.width = 768; c.height = 512;
  const g = c.getContext('2d'), gr = g.createRadialGradient(384, 200, 10, 384, 220, 520);
  gr.addColorStop(0, '#2b2723'); gr.addColorStop(0.55, '#141210'); gr.addColorStop(1, '#090807');
  g.fillStyle = gr; g.fillRect(0, 0, 768, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
}

// A soft studio around the scene for the stone's reflections (a light box with two soft panels).
function studioEnvironment() {
  const env = new THREE.Scene();
  const box = new THREE.Mesh(new THREE.BoxGeometry(10, 10, 10), new THREE.MeshBasicMaterial({ color: 0x15130f, side: THREE.BackSide }));
  env.add(box);
  const panel = (w, h, c, pos, rot) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
    m.position.set(...pos); m.rotation.set(...rot); env.add(m);
  };
  panel(4, 2.6, 0xffe2bf, [-1.5, 4.6, 1], [Math.PI / 2, 0, 0]);
  panel(2.4, 3, 0x9fb0aa, [4.9, 1.5, 0], [0, -Math.PI / 2, 0]);
  panel(3, 1.6, 0xffffff, [0, 2, -4.9], [0, 0, 0]);
  const pmrem = new THREE.PMREMGenerator(renderer);
  return pmrem.fromScene(env, 0.04).texture;
}
scene.environment = studioEnvironment();

// ---------------------------------------------------------------- textures
const pending = [];
window.__errors = [];
function stoneTexture(name, own = {}) {
  const c = document.createElement('canvas');
  const t = new THREE.CanvasTexture(c);
  const img = new Image();
  pending.push(new Promise(res => {
    img.onload = () => {
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const g = c.getContext('2d');
      g.drawImage(img, 0, 0);
      const d = g.getImageData(0, 0, c.width, c.height), px = d.data, k = own.veins ?? L.stone.veins, sat = own.sat ?? L.stone.sat, ga = own.gamma ?? L.stone.gamma;
      // the photo's white: its 97th percentile of brightness
      const hist = new Uint32Array(256);
      for (let i = 0; i < px.length; i += 4) hist[(px[i] * 0.3 + px[i + 1] * 0.59 + px[i + 2] * 0.11) | 0]++;
      let acc = 0, white = 255; const n = px.length / 4;
      for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc > n * 0.03) { white = v; break; } }
      for (let i = 0; i < px.length; i += 4) {
        let r = px[i] * 255 / white, gr = px[i + 1] * 255 / white, b = px[i + 2] * 255 / white;
        const y = r * 0.3 + gr * 0.59 + b * 0.11;
        r = y + (r - y) * sat; gr = y + (gr - y) * sat; b = y + (b - y) * sat;
        const f = v => { v = Math.min(255, Math.max(0, v)); v = 255 - (255 - v) * k; v = Math.max(0, v); return 255 * Math.pow(v / 255, ga); };
        px[i] = f(r); px[i + 1] = f(gr); px[i + 2] = f(b);
      }
      g.putImageData(d, 0, 0);
      t.needsUpdate = true;
      res();
    };
    // a photo that is not there (the weekly job may have renamed it) is an error render.py stops on:
    // a flat blank stone would be committed unseen
    img.onerror = () => { window.__errors.push('stone photo not loaded: ' + name); res(); };
  }));
  img.src = '../../data/images/' + name + '.webp';
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.MirroredRepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

// A canvas texture (procedural: the cooktop's rings, the flames, the logs).
function canvasTexture(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function rand(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// ---------------------------------------------------------------- materials
const M = {};
function stone(name, opts = {}) {
  const key = name + JSON.stringify(opts);
  if (M[key]) return M[key];
  return (M[key] = new THREE.MeshPhysicalMaterial({
    map: stoneTexture(name, opts), roughness: opts.roughness ?? 0.2, metalness: 0,
    clearcoat: (opts.clearcoat ?? 0.55) * 0.5, clearcoatRoughness: 0.1, envMapIntensity: L.env * (opts.env ?? 1.4) * 0.7,
    color: new THREE.Color(opts.tint || '#ffffff'),
  }));
}
const mat = {
  dark: new THREE.MeshStandardMaterial({ color: '#262826', roughness: 0.34, metalness: 0.05, envMapIntensity: L.env * 1.6 }),
  darker: new THREE.MeshStandardMaterial({ color: '#0f100f', roughness: 0.6 }),
  core: new THREE.MeshStandardMaterial({ color: '#1b1a18', roughness: 0.92 }),
  brass: new THREE.MeshStandardMaterial({ color: '#c8a274', roughness: 0.3, metalness: 1, envMapIntensity: L.env * 2.5 }),
  steel: new THREE.MeshStandardMaterial({ color: '#c9ccce', roughness: 0.22, metalness: 1, envMapIntensity: L.env * 2.5 }),
  blackGlass: new THREE.MeshPhysicalMaterial({ color: '#0b0d0c', roughness: 0.06, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: L.env * 2.5 }),
  ceramic: new THREE.MeshPhysicalMaterial({ color: '#f6f5f1', roughness: 0.2, clearcoat: 0.7, envMapIntensity: L.env * 1.6 }),
  firebox: new THREE.MeshStandardMaterial({ color: '#141210', roughness: 0.7, metalness: 0.3 }),
  sinkSteel: new THREE.MeshStandardMaterial({ color: '#b9bcbd', roughness: 0.32, metalness: 0.85, envMapIntensity: L.env * 3.5 }),
};


// ---------------------------------------------------------------- geometry helpers
// Planar UVs from world coordinates (cm): each face takes the two axes it lies along, so a stone's
// pattern runs on over an edge (the top and its front share x). S: the photo's width in cm.
function worldUV(geo, S = 180, opts = {}) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  g.computeVertexNormals();
  const p = g.attributes.position, n = g.attributes.normal;
  const uv = new Float32Array(p.count * 2);
  const ar = 850 / 500, ou = opts.ou || 0, ov = opts.ov || 0, flip = opts.flipU ? -1 : 1;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));
    let u, v;
    if (ay >= ax && ay >= az) { u = x; v = -z; }
    else if (ax >= az) { u = -z; v = y; }
    else { u = x; v = y; }
    uv[i * 2] = flip * (u / S) + ou;
    uv[i * 2 + 1] = v / (S / ar) + ov;
  }
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  return g;
}
const productMeshes = [];   // what the camera frames (the room and the glows are left out)
function add(geo, material, { cast = true, receive = true, room = false } = {}) {
  const m = new THREE.Mesh(geo, material);
  m.castShadow = cast; m.receiveShadow = receive;
  scene.add(m);
  if (!room) productMeshes.push(m);
  return m;
}
// A box from its min/max corners (cm).
function boxGeo(x0, x1, y0, y1, z0, z1, bevel = 0) {
  let g;
  if (bevel > 0) {
    const s = new THREE.Shape();
    const w = x1 - x0, h = y1 - y0;
    s.moveTo(0, 0); s.lineTo(w, 0); s.lineTo(w, h); s.lineTo(0, h); s.lineTo(0, 0);
    g = new THREE.ExtrudeGeometry(s, { depth: z1 - z0 - 2 * bevel, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel * 0.999, bevelSegments: 3, curveSegments: 4 });
    g.translate(x0, y0, z0 + bevel);
    // the bevel grows the outline: shrink back to the box
    g.computeBoundingBox();
    const b = g.boundingBox, sx = (x1 - x0) / (b.max.x - b.min.x), sy = (y1 - y0) / (b.max.y - b.min.y);
    g.translate(-b.min.x, -b.min.y, 0); g.scale(sx, sy, 1); g.translate(x0, y0, 0);
  } else {
    g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
    g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  }
  return g;
}
function box(x0, x1, y0, y1, z0, z1, material, o = {}) {
  let g = boxGeo(x0, x1, y0, y1, z0, z1, o.bevel || 0);
  if (material.map && material.map.isTexture && material.isMeshPhysicalMaterial) g = worldUV(g, o.S, o);
  return add(g, material, o);
}
// A slab from an outline in the floor plane (x, z), y0..y1, holes optional.
function slab(outline, y0, y1, material, o = {}) {
  const s = new THREE.Shape(outline.map(([x, z]) => new THREE.Vector2(x, -z)));
  (o.holes || []).forEach(hole => s.holes.push(new THREE.Path(hole.map(([x, z]) => new THREE.Vector2(x, -z)))));
  let g = new THREE.ExtrudeGeometry(s, { depth: y1 - y0, bevelEnabled: !!o.bevel, bevelThickness: o.bevel || 0, bevelSize: o.bevel || 0, bevelSegments: 3, curveSegments: 48 });
  g.rotateX(-Math.PI / 2);
  g.translate(0, y0, 0);
  if (material.isMeshPhysicalMaterial && material.map) g = worldUV(g, o.S, o);
  return add(g, material, o);
}
function tube(points, r, material) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)), false, 'catmullrom', 0.1);
  return add(new THREE.TubeGeometry(curve, 64, r, 16, false), material);
}
function lathe(profile, material, pos) {
  const g = new THREE.LatheGeometry(profile.map(([r, y]) => new THREE.Vector2(r, y)), 64);
  g.translate(...pos);
  return add(g, material);
}

// ---------------------------------------------------------------- the room
let floorMesh = null;
// What glows (the LED, the fire, the lit windows): its own pass, bloomed by render.py.
function shine(m) { m.userData.glow = true; return m; }
// A strip of warm LED light: a thin bright box (its glow and the light it throws are the washes').
function led(x0, x1, y0, y1, z0, z1, { color = '#ffc98c' } = {}) {
  const m = new THREE.Mesh(boxGeo(x0, x1, y0, y1, z0, z1), new THREE.MeshBasicMaterial({ color }));
  scene.add(m); shine(m);
  return m;
}
// The light a strip throws on a surface: a quad from o along u (the strip's length) and v (away from
// the strip), bright at the strip and fading out, soft at its two ends.
const washTex = (() => {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const g = c.getContext('2d'), img = g.createImageData(256, 256);
  for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
    const v = y / 255, u = x / 255;
    const along = Math.min(1, Math.min(u, 1 - u) / 0.12);
    const a = Math.pow(1 - v, 2.2) * (0.35 + 0.65 * Math.exp(-v * 6)) * along * along * (3 - 2 * along);
    const i = (y * 256 + x) * 4;
    img.data[i] = 255; img.data[i + 1] = 255; img.data[i + 2] = 255; img.data[i + 3] = Math.round(255 * a);
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
function wash(o, u, v, { color = '#ffbf80', strength = 0.9, lift = 0.08 } = {}) {
  const O = new THREE.Vector3(...o), U = new THREE.Vector3(...u), V = new THREE.Vector3(...v);
  const n = new THREE.Vector3().crossVectors(U, V).normalize();
  if (n.x + n.y + n.z < 0) n.negate();   // off the surface toward the viewer (front, right, above)
  n.multiplyScalar(lift);
  const pts = [O.clone(), O.clone().add(U), O.clone().add(U).add(V), O.clone().add(V)].map(q => q.add(n));
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts.flatMap(q => [q.x, q.y, q.z]), 3));
  // the canvas is flipped on upload: v = 1 is its top row, the bright one, at the strip
  g.setAttribute('uv', new THREE.Float32BufferAttribute([0, 1, 1, 1, 1, 0, 0, 0], 2));
  g.setIndex([0, 1, 2, 0, 2, 3]);
  // brighter than white before the tone mapping: a lit surface, not a sticker
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ map: washTex, color: new THREE.Color(color).multiplyScalar(2.6 * strength), transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  m.userData.wash = true; shine(m);
  scene.add(m);
  return m;
}

// The floor: dark and glossy; its reflection is a pass of its own (render.py lays it in).
function room() {
  floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(20000, 20000).rotateX(-Math.PI / 2),
    new THREE.MeshPhysicalMaterial({ color: '#0f0e0d', roughness: 0.42, clearcoat: 0.6, clearcoatRoughness: 0.3, envMapIntensity: 0.25 }));
  floorMesh.receiveShadow = true; scene.add(floorMesh);
}

// ---------------------------------------------------------------- the products
const LIGHT_STONE = 'calacatta-borghini-2';
const P = {};

// Столешница на кухню: an island on dark fronts -- the stone on top and down its right end,
// an undermount sink with a tall tap, an induction hob flush with the stone.
P.stoleshnitsa_kuhnya = () => {
  room();
  const X0 = 70, X1 = 300, Z0 = 80, Z1 = 175, Hh = 92, t = 3;
  const st = stone(LIGHT_STONE);
  // the cabinet body, its plinth, the fronts with their gaps and handles
  box(X0 + 4, X1 - t, 10, Hh - t, Z0 + 4, Z1 - 6, mat.dark);
  box(X0 + 8, X1 - t, 0, 10, Z0 + 8, Z1 - 12, mat.darker);
  const fronts = 4, fw = (X1 - t - X0 - 4) / fronts;
  for (let i = 0; i < fronts; i++) {
    const a = X0 + 4 + i * fw + 0.25, b = X0 + 4 + (i + 1) * fw - 0.25;
    box(a, b, 11, Hh - t - 1, Z1 - 6, Z1 - 4.2, stone('nero-portoro', { veins: 1.0, sat: 0.7, gamma: 1.0, roughness: 0.25, env: 1.2 }), { bevel: 0.3, S: 160 });
    box(a + 6, b - 6, Hh - t - 7, Hh - t - 5.6, Z1 - 4.2, Z1 - 3, mat.brass);
  }
  // the worktop with the sink's opening, and its waterfall end
  const sx0 = X0 + 40, sx1 = X0 + 95, sz0 = Z0 + 22, sz1 = Z0 + 68;
  slab([[X0, Z1], [X1, Z1], [X1, Z0], [X0, Z0]], Hh - t, Hh, st, { holes: [[[sx0, sz1], [sx0, sz0], [sx1, sz0], [sx1, sz1]]], S: 220, bevel: 0.25 });
  box(X1 - t, X1, 0, Hh - t, Z0, Z1, st, { S: 220 });
  // the sink below the opening
  box(sx0 + 0.3, sx1 - 0.3, Hh - t - 11, Hh - t - 10, sz0 + 0.3, sz1 - 0.3, mat.sinkSteel);
  box(sx0, sx0 + 0.6, Hh - t - 11, Hh - t, sz0, sz1, mat.sinkSteel);
  box(sx1 - 0.6, sx1, Hh - t - 11, Hh - t, sz0, sz1, mat.sinkSteel);
  box(sx0, sx1, Hh - t - 11, Hh - t, sz0, sz0 + 0.6, mat.sinkSteel);
  // the tap: a tall swan neck
  const tx = (sx0 + sx1) / 2, tz = Z0 + 12;
  lathe([[0, 0], [2.6, 0], [2.4, 1], [1.4, 3], [1.3, 6], [0, 6]], mat.steel, [tx, Hh, tz]);
  tube([[tx, Hh + 5, tz], [tx, Hh + 30, tz], [tx, Hh + 38, tz + 6], [tx, Hh + 36, tz + 16], [tx, Hh + 28, tz + 19]], 1.1, mat.steel);
  // the hob: black glass with its rings
  const hob = canvasTexture(512, 360, (g, w, h) => {
    g.fillStyle = '#0b0d0c'; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(160,165,160,0.55)'; g.lineWidth = 3;
    [[0.27, 0.3, 0.2], [0.72, 0.3, 0.16], [0.27, 0.72, 0.16], [0.72, 0.72, 0.2]].forEach(([x, y, r]) => { g.beginPath(); g.arc(x * w, y * h, r * h, 0, 7); g.stroke(); });
  });
  const hobMat = new THREE.MeshPhysicalMaterial({ map: hob, roughness: 0.05, clearcoat: 1, envMapIntensity: L.env * 2.5 });
  const hg = new THREE.BoxGeometry(60, 0.5, 46); hg.translate(X0 + 160, Hh + 0.05, Z0 + 47);
  add(hg, [mat.blackGlass, mat.blackGlass, hobMat, mat.blackGlass, mat.blackGlass, mat.blackGlass]);
  led(X0 + 8, X1 - t - 0.5, 9.2, 9.9, Z1 - 7, Z1 - 5.8);
  wash([X0 + 8, 0, Z1 - 7], [X1 - t - X0 - 8, 0, 0], [0, 0, 46], { strength: 0.85 });
  wash([X0 + 8, 9.2, Z1 - 12], [X1 - t - X0 - 8, 0, 0], [0, -9.2, 0], { strength: 0.5, lift: 0.05 });
  return { target: [X0 + 115, 46, Z0 + 47], radius: 150 };
};

// Столешница в ванную: a floating top with a vessel basin, the tap from the wall, an oak drawer
// below and a round mirror with its light behind.
P.stoleshnitsa_vannaya = () => vannaya();

// Подоконник: a window opening in a thick wall, daylight coming in, the sill running out of it.
P.podokonnik = () => podokonnik();

// Пол: nine large slabs in the room's corner, the pattern running on over the joints.
P.pol = () => {
  room();
  const N = 3, S = 80, g = 0.35, st = stone(LIGHT_STONE, { roughness: 0.22, clearcoat: 0.4 });
  box(3, N * S - 3, 0, 0.6, 3, N * S - 3, mat.darker, { cast: false });
  led(3, N * S - 3, 0.05, 0.5, N * S - 3.6, N * S - 3);
  led(N * S - 3.6, N * S - 3, 0.05, 0.5, 3, N * S - 3);
  wash([3, 0, N * S - 3], [N * S - 6, 0, 0], [0, 0, 34], { strength: 0.75 });
  wash([N * S - 3, 0, N * S - 3], [0, 0, -(N * S - 6)], [34, 0, 0], { strength: 0.75 });
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    box(i * S + g, (i + 1) * S - g, 0.6, 2.4, j * S + g, (j + 1) * S - g, st, { S: 3 * S, bevel: 0.15, cast: false });
  }
  return { el: 26, az: 40, margin: 0.8, noContact: true };
};

// Стены: both walls of the corner clad in large slabs, joints between them, the pattern over the corner.
P.stena = () => {
  room();
  const Hh = 210, A = 200, B = 160, sh = Hh / 3, sw = 100, th = 2;
  const st = stone(LIGHT_STONE, { roughness: 0.2 });
  const back = stone(LIGHT_STONE, { roughness: 0.2 });
  // nothing behind: the corner of stone is the picture
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c * sw < A; c++) box(c * sw + 0.2, Math.min((c + 1) * sw, A) - 0.2, r * sh + 0.2, (r + 1) * sh - 0.2, -th, 0, back, { S: 300, bevel: 0.15 });
    for (let c = 0; c * sw < B; c++) box(-th, 0, r * sh + 0.2, (r + 1) * sh - 0.2, c * sw + 0.2, Math.min((c + 1) * sw, B) - 0.2, st, { S: 300, bevel: 0.15 });
  }
  // a wall-washer: a warm graze of light from the ceiling
  led(1, A, Hh + 0.3, Hh + 1.1, 0, 1.4);
  led(0, 1.4, Hh + 0.3, Hh + 1.1, 1, B);
  wash([1, Hh, 0], [A - 1, 0, 0], [0, -150, 0], { strength: 0.55, lift: 0.1 });
  wash([0, Hh, B], [0, 0, -(B - 1)], [0, -150, 0], { strength: 0.55, lift: 0.1 });
  return { target: [70, 120, 70], radius: 190, keyScale: 0.9 };
};

// Фасад: a two-storey house as an architect's model on a plinth -- stone cladding, a plinth course,
// a band between the floors, a cornice, windows with their sills.
P.fasad = () => {
  room();
  const st = stone('limestone-white', { roughness: 0.6, clearcoat: 0, env: 0.4, veins: 1.1, sat: 0.55 });
  const st2 = stone('crema-marfil', { roughness: 0.45, clearcoat: 0.1, env: 0.5, veins: 1.1, sat: 0.6 });

  box(X0, X1, 24, Hh, Z0, Z1 - 2, st, { S: 140 });
  {

    const sk = new THREE.Shape([[X0, 24], [X1, 24], [X1, Hh], [X0, Hh]].map(([x, y]) => new THREE.Vector2(x, y)));
    [X0 + 26, (X0 + X1) / 2, X1 - 26].forEach(cx => [32, 80].forEach(y => (cx === (X0 + X1) / 2 && y === 32) || sk.holes.push(new THREE.Path([[cx - 10, y], [cx + 10, y], [cx + 10, y + 28], [cx - 10, y + 28]].map(([x, yy]) => new THREE.Vector2(x, yy))))));
    sk.holes.push(new THREE.Path([[(X0 + X1) / 2 - 13, 24], [(X0 + X1) / 2 + 13, 24], [(X0 + X1) / 2 + 13, 68], [(X0 + X1) / 2 - 13, 68]].map(([x, y]) => new THREE.Vector2(x, y))));

  box(X0 - 1.5, X1 + 1.5, 66, 70, Z0 - 1.5, Z1 + 1.5, st2, { S: 120 });
  box(X0 - 5, X1 + 5, Hh, Hh + 6, Z0 - 5, Z1 + 5, st2, { S: 120 });
  box(X0 - 2, X1 + 2, Hh + 6, Hh + 10, Z0 - 2, Z1 + 2, st2, { S: 120 });
  const lit = new THREE.MeshBasicMaterial({ map: canvasTexture(32, 64, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);

  const winFrame = new THREE.MeshStandardMaterial({ color: '#24211e', roughness: 0.35, metalness: 0.7 });
  const litVariants = [0.75, 1, 0.55, 0.9, 1, 0.65].map(k => { const m = lit.clone(); m.color = new THREE.Color(k, k, k); return m; });
  let winN = 0;
  const win = (cx, y0, face) => {

    // the bronze frame: two uprights, a head, a mullion and a transom bar (a, b: along the wall; c, e: up)

    if (face === 'front') bars.forEach(([a, b, c, e]) => box(a, b, c, e, Z1 - 1.6, Z1 - 0.4, winFrame, { cast: false }));
    else bars.forEach(([a, b, c, e]) => box(X1 + 0.3, X1 + 1.2, c, e, a, b, winFrame, { cast: false }));
    if (face === 'front') {

      box(cx - w / 2 - 2, cx + w / 2 + 2, y0 - 2.5, y0, Z1, Z1 + 2.5, st2, { S: 120 });
      box(cx - w / 2 - 1.5, cx + w / 2 + 1.5, y0 + h, y0 + h + 2, Z1, Z1 + 1.2, st2, { S: 120 });
    } else {

  [X0 + 26, (X0 + X1) / 2, X1 - 26].forEach(cx => { if (cx !== (X0 + X1) / 2) win(cx, 32, 'front'); win(cx, 80, 'front'); });
  [Z0 + 28, Z1 - 28].forEach(cz => { win(cz, 32, 'side'); win(cz, 80, 'side'); });
  // the entrance: two stone steps, a stone portal standing out of the wall, a walnut door set back in

  const ex = (X0 + X1) / 2, dw = 26, dh = 38;

    box(ex - dw / 2 - 7, ex + dw / 2 + 7, 16, 24, Z1 + 2, Z1 + 8, st2, { S: 120, bevel: 0.3 });
    box(ex - dw / 2 - 6, ex - dw / 2, 24, 24 + dh + 6, Z1, Z1 + 3.5, st2, { S: 120, bevel: 0.25 });
    box(ex + dw / 2, ex + dw / 2 + 6, 24, 24 + dh + 6, Z1, Z1 + 3.5, st2, { S: 120, bevel: 0.25 });
    box(ex - dw / 2 - 7, ex + dw / 2 + 7, 24 + dh + 6, 24 + dh + 11, Z1, Z1 + 4.5, st2, { S: 120, bevel: 0.25 });
    const doorTex = canvasTexture(256, 512, (g, w, h) => {
      const r = rand(5);
      g.fillStyle = '#5a3d29'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 140; i++) {
        const x = r() * w, a = 0.05 + r() * 0.12;
        g.strokeStyle = r() > 0.5 ? `rgba(40,24,14,${a})` : `rgba(150,105,70,${a})`;
        g.lineWidth = 0.6 + r() * 2;
        g.beginPath(); for (let y = 0; y <= h; y += 12) g.lineTo(x + Math.sin(y / (50 + r() * 30) + i) * 2.5, y); g.stroke();
      }
    });
    const doorMat = new THREE.MeshStandardMaterial({ map: doorTex, roughness: 0.45, envMapIntensity: 0.6 });
    box(ex - dw / 2, ex + dw / 2, 24, 24 + dh, Z1 - 1, Z1 + 0.8, doorMat);
    for (let k = 1; k < 6; k++) box(ex - dw / 2 + k * dw / 6 - 0.15, ex - dw / 2 + k * dw / 6 + 0.15, 24.5, 24 + dh - 0.5, Z1 + 0.8, Z1 + 0.85, mat.darker, { cast: false });
    box(ex + dw / 2 - 4.2, ex + dw / 2 - 3.4, 24 + 8, 24 + 30, Z1 + 0.8, Z1 + 2.2, mat.brass);
    shine(box(ex - dw / 2, ex + dw / 2, 24 + dh, 24 + dh + 6, Z1 - 1, Z1 + 0.6, lit, { cast: false }));
    box(ex - dw / 2, ex + dw / 2, 24 + dh - 0.4, 24 + dh + 0.4, Z1 + 0.6, Z1 + 1.2, mat.darker, { cast: false });

      led(lx - 1.2, lx + 1.2, 24 + 21.6, 24 + 22, Z1 + 0.2, Z1 + 1.8, { color: '#ffd6a0' });
      led(lx - 1.2, lx + 1.2, 24 + 34, 24 + 34.4, Z1 + 0.2, Z1 + 1.8, { color: '#ffd6a0' });

      wash([lx - 7, 24 + 34, Z1], [14, 0, 0], [0, 22, 0], { strength: 0.6, lift: 0.08 });

};

// Лестница: a straight flight of eight steps along the left wall, stone treads with a nosing over

// Камины: a portal on a hearth -- pilasters, a lintel, a mantel shelf, the fire in a dark firebox.
P.kaminy = () => {
  room();
  const X0 = 60, W = 170, D = 34, st = stone(LIGHT_STONE);
  const cx = X0 + W / 2;
  box(X0 - 14, X0 + W + 14, 0, 8, 0, D + 22, st, { S: 200, bevel: 0.3 });        // the hearth
  box(X0, X0 + 30, 8, 108, 0, D, st, { S: 200, bevel: 0.3 });                    // pilasters

  box(X0 - 8, X0 + W + 8, 108, 115, -0.01, D + 8, st, { S: 200, bevel: 0.4 });  // the shelf
  // the firebox and the fire
  box(X0 + 30, X0 + W - 30, 8, 84, 0, 3, mat.firebox, { cast: false });
  box(X0 + 30, X0 + 33, 8, 84, 0, D, mat.firebox, { cast: false });
  box(X0 + W - 33, X0 + W - 30, 8, 84, 0, D, mat.firebox, { cast: false });
  box(X0 + 30, X0 + W - 30, 81, 84, 0, D, mat.firebox, { cast: false });
  // the flames: soft particles rising from the logs, white-yellow at the root, orange, then a dark red
  // that fades; summed like light ('lighter'), then softened
  const flameTex = seed => canvasTexture(512, 640, (g, w, h) => {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const q = c.getContext('2d'); q.globalCompositeOperation = 'lighter';
    const r = rand(seed);
    for (let k = 0; k < 11; k++) {
      const x0 = w * (0.16 + 0.68 * r()), top = h * (0.45 + 0.5 * r()), w0 = w * (0.05 + 0.05 * r());
      const f1 = 2 + 3 * r(), f2 = 5 + 6 * r(), p1 = 6.3 * r(), p2 = 6.3 * r(), lean = (r() - 0.5) * 0.25;
      for (let i = 0; i < 90; i++) {
        const t = i / 89, y = h - 8 - t * top;
        const x = x0 + w * (lean * t + 0.06 * t * Math.sin(f1 * t * 6.3 + p1) + 0.025 * t * Math.sin(f2 * t * 6.3 + p2));
        const rad = w0 * (1.05 - t) ** 0.75 + 2;
        const col = t < 0.12 ? [255, 246, 214] : t < 0.35 ? [255, 206, 112] : t < 0.62 ? [255, 142, 46] : [196, 64, 18];
        const a = 0.13 * (1 - t) ** 0.6;
        const gr = q.createRadialGradient(x, y, 0, x, y, rad);
        gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(1, `rgba(${col},0)`);
        q.fillStyle = gr; q.beginPath(); q.arc(x, y, rad, 0, 7); q.fill();
      }
    }
    g.filter = 'blur(2.5px)'; g.drawImage(c, 0, 0); g.filter = 'none';
  });
  [[0, D - 15, 3], [0.45, D - 19, 7], [-0.4, D - 12, 13]].forEach(([rot, z, seed]) => {
    const fm = new THREE.Mesh(new THREE.PlaneGeometry(W - 82, 64), new THREE.MeshBasicMaterial({ map: flameTex(seed), color: new THREE.Color(1.45, 1.45, 1.45),
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
    fm.position.set(cx, 12 + 30, z); fm.rotation.y = rot; scene.add(fm); shine(fm);
  });
  // the logs: charred bark, its cracks glowing
  const barkTex = canvasTexture(512, 128, (g, w, h) => {
    const r = rand(9);
    g.fillStyle = '#1e1611'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(${60 + 40 * r()},${40 + 25 * r()},${28 + 15 * r()},0.35)`; g.fillRect(r() * w, r() * h, 6 + 30 * r(), 1 + 2 * r()); }
  });
  const crackTex = canvasTexture(512, 128, (g, w, h) => {
    const r = rand(10);
    g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#ff7a24'; g.lineCap = 'round';
    for (let i = 0; i < 70; i++) {
      g.lineWidth = 0.6 + 1.6 * r(); g.globalAlpha = 0.4 + 0.6 * r();
      const x = r() * w, y = h * (0.45 + 0.55 * r());
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + 8 + 30 * r(), y + (r() - 0.5) * 4); g.stroke();
    }
    g.globalAlpha = 1;
  });
  const logMat = new THREE.MeshStandardMaterial({ map: barkTex, roughness: 0.95, emissive: '#ff6a1a', emissiveMap: crackTex, emissiveIntensity: 2.2 });
  const endMat = new THREE.MeshStandardMaterial({ color: '#4a3220', roughness: 0.9, emissive: '#ff5a10', emissiveIntensity: 0.35 });
  const log = (a, b, rad) => {
    const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), len = A.distanceTo(B);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad * 1.06, len, 28, 1, false), [logMat, endMat, endMat]);
    m.position.copy(A).add(B).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.clone().sub(A).normalize());
    m.castShadow = true; scene.add(m);
  };
  log([cx - 30, 12.5, D - 19], [cx + 28, 12.5, D - 13], 3.4);
  log([cx - 24, 12.2, D - 11], [cx + 32, 12.2, D - 19], 3.1);
  log([cx - 12, 17.5, D - 16], [cx + 14, 18.5, D - 15], 2.6);
  // the bed of embers under them
  const emberTex = canvasTexture(256, 64, (g, w, h) => {
    const r = rand(12);
    g.fillStyle = '#120a06'; g.fillRect(0, 0, w, h);
    g.filter = 'blur(1.5px)';
    for (let i = 0; i < 160; i++) { const v = r(); g.fillStyle = `rgba(255,${80 + 90 * v},${20 * v},${0.15 + 0.45 * r()})`; g.beginPath(); g.arc(r() * w, r() * h, 0.8 + 2 * r(), 0, 7); g.fill(); }
  });
  const ember = new THREE.Mesh(new THREE.BoxGeometry(W - 92, 0.8, D - 16).translate(cx, 8.4, (D - 16) / 2 + 4),
    new THREE.MeshBasicMaterial({ map: emberTex, color: new THREE.Color(0.75, 0.6, 0.5) }));
  scene.add(ember); shine(ember);
  const fire = new THREE.PointLight('#ff9a4a', 16000, 300, 2); fire.position.set(cx, 34, D - 6); scene.add(fire);
  fire.castShadow = true; fire.shadow.mapSize.set(1024, 1024); fire.shadow.radius = 6;
  const glowIn = new THREE.PointLight('#ff8a3a', 6000, 120, 2); glowIn.position.set(cx, 30, 6); scene.add(glowIn);

};

// Столешница в ванную: a wall-hung vanity as big as the kitchen's island reads -- the stone top over
// two deep drawers in dark marble (as the island's fronts), a vessel basin, a tall tap on the stone, a
// round mirror lit from behind; a line of light under the vanity on the wall.
function vannaya() {
  room();
  const X0 = 40, X1 = 200, D = 54, y0 = 88, t = 4, ch = 42;
  const st = stone(LIGHT_STONE);
  const nero = stone('nero-portoro', { veins: 1.0, sat: 0.7, gamma: 1.0, roughness: 0.25, env: 1.2 });
  box(X0 + 2, X1 - 2, y0 - t - ch, y0 - t, 0, D - 4, mat.dark);
  box(X0 + 2.2, X1 - 2.2, y0 - t - ch + 0.4, y0 - t - ch / 2 - 0.3, D - 4, D - 2.2, nero, { bevel: 0.3, S: 170 });
  box(X0 + 2.2, X1 - 2.2, y0 - t - ch / 2 + 0.3, y0 - t - 0.6, D - 4, D - 2.2, nero, { bevel: 0.3, S: 170 });
  box(X0, X1, y0 - t, y0, 0, D, st, { S: 210, bevel: 0.3 });
  // the basin: a vessel bowl, right of centre
  const bx = (X0 + X1) / 2 + 16, bz = D / 2 + 3;
  lathe([[0, 0], [13, 0], [19, 3.5], [22.5, 10], [23.5, 15], [22.4, 15], [21, 10], [17.6, 4.5], [0, 3.5]], mat.ceramic, [bx, y0, bz]);
  // a tall tap on the stone behind the bowl, brushed steel
  const tz = 9;
  lathe([[0, 0], [2.4, 0], [2.2, 1], [1.5, 3], [1.4, 26], [0, 26]], mat.steel, [bx, y0, tz]);
  tube([[bx, y0 + 25, tz], [bx, y0 + 30, tz + 2], [bx, y0 + 30, tz + 10], [bx, y0 + 27, tz + 13]], 1.15, mat.steel);
  // the mirror: a dark glass that reflects the vanity (render.py lays its reflection in), a thin lit
  // edge, and its light on the wall behind
  const mr = 30, mc = [bx, y0 + 34 + mr], mz = 2.2;
  const mirror = new THREE.Mesh(new THREE.CylinderGeometry(mr, mr, 1.6, 128).rotateX(Math.PI / 2),
    new THREE.MeshPhysicalMaterial({ color: '#202020', roughness: 0.05, metalness: 1, envMapIntensity: 0.6 }));
  mirror.position.set(mc[0], mc[1], mz - 0.8); mirror.castShadow = true; scene.add(mirror); productMeshes.push(mirror);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(mr - 0.6, 0.4, 12, 200), new THREE.MeshBasicMaterial({ color: '#ffd7a6' }));
  ring.position.set(mc[0], mc[1], mz + 0.05); scene.add(ring); shine(ring);
  const halo = canvasTexture(512, 512, (g, w) => {
    const gr = g.createRadialGradient(w / 2, w / 2, w * 0.3, w / 2, w / 2, w / 2);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, w);
  });
  const hm = new THREE.Mesh(new THREE.PlaneGeometry(mr * 3.4, mr * 3.4), new THREE.MeshBasicMaterial({ map: halo, color: new THREE.Color('#ffbf80').multiplyScalar(1.4),
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  hm.position.set(mc[0], mc[1], 0.1); scene.add(hm);
  // the line of light under the vanity, on the wall
  led(X0 + 6, X1 - 6, y0 - t - ch - 0.6, y0 - t - ch, 3, D - 10);
  wash([X0 + 6, y0 - t - ch, 0], [X1 - X0 - 12, 0, 0], [0, -46, 0], { strength: 0.75 });
  // what the mirror sees (only in its reflection): the dim bathroom behind the camera -- a warm wall
  // lit from a ceiling line, a doorway's glow, a towel rail's line
  const roomTex = canvasTexture(1024, 512, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#5a4a3c'); gr.addColorStop(0.18, '#3a3029'); gr.addColorStop(1, '#17130f');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.filter = 'blur(10px)';
    const dg = g.createLinearGradient(0, 0, 0, h);
    dg.addColorStop(0, 'rgba(255,214,170,0.55)'); dg.addColorStop(1, 'rgba(255,190,140,0.15)');
    g.fillStyle = dg; g.fillRect(w * 0.62, h * 0.12, w * 0.16, h * 0.9);
    g.fillStyle = 'rgba(200,190,180,0.25)'; g.fillRect(w * 0.18, h * 0.42, w * 0.22, 6);
    g.filter = 'none';
  });
  const behind = new THREE.Mesh(new THREE.PlaneGeometry(700, 350), new THREE.MeshBasicMaterial({ map: roomTex, fog: false, side: THREE.DoubleSide }));
  behind.position.set(bx, 150, 420); behind.rotation.y = Math.PI; behind.visible = false; scene.add(behind);
  return { walls: 'back', mirror: { mesh: mirror, plane: mz, hide: [ring, hm], show: [behind] }, az: 24, el: 9 };
}

// Подоконник: a deep window in a thick wall, at night: the marble sill runs through the reveal and out
// over the wall; a downlight hidden in the head of the reveal pours over it; the glass dark, holding the
// night and a few lights far off; a line of light under the sill's nose; shot straight on and a little
// from above, the window's top out of frame.
function podokonnik() {
  const T = 42, X0 = 60, X1 = 200, Y0 = 84, Y1 = 226;
  room();
  const wallMat = new THREE.MeshStandardMaterial({ color: '#24211d', roughness: 0.85 });
  [[X0 - 700, X0, 0, 800], [X1, X1 + 700, 0, 800], [X0, X1, 0, Y0], [X0, X1, Y1, 800]].forEach(([a, b, c, d]) => box(a, b, c, d, -T, 0, wallMat, { room: true }));
  const fr = 3.4, fz0 = -T + 3, fz1 = -T + 9;
  const frameMat = new THREE.MeshStandardMaterial({ color: '#2a2622', roughness: 0.32, metalness: 0.75, envMapIntensity: 1.4 });
  [[X0, X1, Y0, Y0 + fr], [X0, X1, Y1 - fr, Y1], [X0, X0 + fr, Y0, Y1], [X1 - fr, X1, Y0, Y1], [(X0 + X1) / 2 - fr / 2, (X0 + X1) / 2 + fr / 2, Y0, Y1]]
    .forEach(([a, b, c, d]) => box(a, b, c, d, fz0, fz1, frameMat));
  // the night outside
  const nightTex = canvasTexture(512, 512, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#0b1320'); gr.addColorStop(0.55, '#1b2b40'); gr.addColorStop(0.78, '#2f3a4c'); gr.addColorStop(1, '#121418');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    const r = rand(31);
    g.filter = 'blur(2px)';
    for (let k = 0; k < 6; k++) {
      const x = w * (0.1 + 0.8 * r()), y = h * (0.74 + 0.05 * r()), rr = 1.5 + 2.5 * r();
      const gl = g.createRadialGradient(x, y, 0, x, y, rr * 3);
      gl.addColorStop(0, 'rgba(255,196,130,0.9)'); gl.addColorStop(1, 'rgba(255,170,100,0)');
      g.fillStyle = gl; g.beginPath(); g.arc(x, y, rr * 3, 0, 7); g.fill();
    }
    g.filter = 'none';
  });
  const night = new THREE.Mesh(new THREE.PlaneGeometry(700, 500), new THREE.MeshBasicMaterial({ map: nightTex, fog: false }));
  night.position.set((X0 + X1) / 2, 160, -T - 120); scene.add(night);
  // the glass: dark, it reflects the niche's light a little
  add(new THREE.PlaneGeometry(X1 - X0 - 2 * fr, Y1 - Y0 - 2 * fr).translate((X0 + X1) / 2, (Y0 + Y1) / 2, fz0 + 3),
    new THREE.MeshPhysicalMaterial({ color: '#0d1218', roughness: 0.03, metalness: 0.2, transparent: true, opacity: 0.35, envMapIntensity: 1.6 }), { cast: false, room: true });
  // the downlight in the reveal's head
  const down = new THREE.SpotLight('#ffd6a4', 3.6, 0, 1.0, 1.0, 0);
  down.position.set((X0 + X1) / 2, Y1 - 1, -T * 0.45); down.target.position.set((X0 + X1) / 2, Y0, -T * 0.4);
  down.castShadow = true; down.shadow.mapSize.set(2048, 2048); down.shadow.radius = 8; down.shadow.blurSamples = 16; down.shadow.bias = -0.0005;
  down.shadow.camera.near = 5; down.shadow.camera.far = 400;
  scene.add(down, down.target);
  led((X0 + X1) / 2 - 3, (X0 + X1) / 2 + 3, Y1 - 0.6, Y1, -T * 0.45 - 3, -T * 0.45 + 3, { color: '#ffe0b8' });
  // its light on the two sides of the reveal and on the sill
  wash([X0 + 0.1, Y1, -T + 9], [0, 0, T - 9], [0, -(Y1 - Y0), 0], { strength: 0.2 });
  wash([X1 - 0.1, Y1, 0], [0, 0, -(T - 9)], [0, -(Y1 - Y0), 0], { strength: 0.2 });
  // the sill: 6 cm thick, through the reveal and 9 cm out over the wall, the opening's width (no ears
  // round the wall's corners: the owner, 2026-11-18)
  slab([[X0, 9], [X1, 9], [X1, fz1], [X0, fz1]], Y0 - 6, Y0, stone(LIGHT_STONE), { S: 150, ou: 0.18, ov: 0.42, bevel: 0.45 });
  led(X0 + 2, X1 - 2, Y0 - 6.6, Y0 - 6, 2, 7.5);
  wash([X0 + 2, Y0 - 6, 0], [X1 - X0 - 4, 0, 0], [0, -46, 0], { strength: 0.6 });
  // straight on and a little from above (the owner, 2026-11-18: «криво, не читается»): the whole window, the sill under it
  return { focusBox: [X0 - 14, X1 + 14, Y0 - 10, Y0 + 92, -T, 9], noContact: true, keyScale: 0.4, az: 0, el: 22, margin: 0.9, lift: 0 };
}

// Панно: two slabs book-matched, floating 4 cm off the wall, a strip of light hidden behind their edge
// all round -- an even halo on the wall about the panel.
function panno() {
  room();
  const cx = 150, y0 = 48, w = 62, h = 172, th = 3, off = 4;
  const stA = stone('calacatta-borghini-13', { sat: 0.55 });
  box(cx - w, cx - 0.15, y0, y0 + h, off, off + th, stA, { S: 150, ou: 0.5, ov: 0.35, bevel: 0.25 });
  box(cx + 0.15, cx + w, y0, y0 + h, off, off + th, stA, { S: 150, flipU: true, ou: 0.5 + 2 * cx / 150, ov: 0.35, bevel: 0.25 });
  box(cx - w + 10, cx + w - 10, y0 + 10, y0 + h - 10, 0, off, mat.darker, { cast: false });
  const d = 26, k = 0.6;
  wash([cx - w, y0 + 2, 0], [0, h - 4, 0], [-d, 0, 0], { strength: k });
  wash([cx + w, y0 + h - 2, 0], [0, -(h - 4), 0], [d, 0, 0], { strength: k });
  wash([cx + w - 2, y0 + h, 0], [-(2 * w - 4), 0, 0], [0, d, 0], { strength: k });
  wash([cx - w + 2, y0, 0], [2 * w - 4, 0, 0], [0, -d, 0], { strength: k });
  return { walls: 'back', keyScale: 0.75, az: 30, el: 10, margin: 0.66 };
}

// ---------------------------------------------------------------- lights and camera
function lights(frame) {
  const k = L.key, s = frame.keyScale ?? 1;
  const key = new THREE.SpotLight(k.color, k.intensity * s, 0, k.angle, k.penumbra, 0);
  key.position.set(frame.target[0] + k.pos[0], k.pos[1], frame.target[2] + k.pos[2]);
  key.target.position.set(...frame.target);
  key.castShadow = true; key.shadow.mapSize.set(4096, 4096);
  key.shadow.radius = 22; key.shadow.blurSamples = 24; key.shadow.bias = -0.0003;
  key.shadow.camera.near = 50; key.shadow.camera.far = 1500;
  scene.add(key, key.target);
  scene.add(new THREE.HemisphereLight(L.fill.sky, L.fill.ground, L.fill.intensity));
  const rim = new THREE.DirectionalLight(L.rim.color, L.rim.intensity);
  rim.position.set(frame.target[0] + L.rim.pos[0], L.rim.pos[1], frame.target[2] + L.rim.pos[2]);
  scene.add(rim);
  const front = new THREE.DirectionalLight('#ffe9d2', L.front);
  front.position.set(frame.target[0] + 300, frame.target[1] + 120, frame.target[2] + 400);
  scene.add(front);
}
function camera(frame) {
  // one view for the series: from the front-right, a long lens; fitted to the product's box
  const cam = new THREE.PerspectiveCamera(24, W / H, 10, 6000);
  const az = THREE.MathUtils.degToRad(frame.az ?? 30), el = THREE.MathUtils.degToRad(frame.el ?? 13);
  const dir = new THREE.Vector3(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az));
  const bb = new THREE.Box3();
  if (frame.focusBox) { const f = frame.focusBox; bb.set(new THREE.Vector3(f[0], f[2], f[4]), new THREE.Vector3(f[1], f[3], f[5])); }
  else productMeshes.forEach(m => bb.expandByObject(m));
  const corners = [];
  for (const x of [bb.min.x, bb.max.x]) for (const y of [bb.min.y, bb.max.y]) for (const z of [bb.min.z, bb.max.z]) corners.push(new THREE.Vector3(x, y, z));
  const target = bb.getCenter(new THREE.Vector3());
  const margin = frame.margin ?? 0.76;
  if (frame.lift === undefined) frame.lift = -0.1;
  let dist = 1500;
  for (let k = 0; k < 12; k++) {
    cam.position.copy(target).addScaledVector(dir, dist);
    cam.lookAt(target); cam.updateMatrixWorld(); cam.updateProjectionMatrix();
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    corners.forEach(c => { const v = c.clone().project(cam); x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x); y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y); });
    const fy = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)) * dist, fx = fy * cam.aspect;
    const right = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0), up = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1);
    target.addScaledVector(right, (x0 + x1) / 2 * fx).addScaledVector(up, ((y0 + y1) / 2 + (frame.lift ?? 0)) * fy);
    dist *= Math.max((x1 - x0) / 2 / margin, (y1 - y0) / 2 / margin);
  }
  cam.position.copy(target).addScaledVector(dir, dist);
  cam.lookAt(target);
  frame.target = bb.getCenter(new THREE.Vector3()).toArray();
  return cam;
}

const frame = P[KEY]();
if (frame.walls === 'back') {
  // the wall the product hangs on runs out of the frame (the camera frames the product alone)
  const bb = new THREE.Box3();
  productMeshes.forEach(m => bb.expandByObject(m));
  box(bb.min.x - 600, bb.max.x + 600, 0, 700, -10, 0, new THREE.MeshStandardMaterial({ color: L.wall, roughness: 0.9 }), { room: true });
}
// a soft contact shadow where the product stands on the floor
if (!frame.noContact) {
  const bb = new THREE.Box3();
  productMeshes.forEach(m => bb.expandByObject(m));
  if (bb.min.y < 2) {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d');
    g.filter = 'blur(14px)'; g.fillStyle = '#000'; g.fillRect(34, 34, 188, 188);
    const t = new THREE.CanvasTexture(c);
    const sh = new THREE.Mesh(new THREE.PlaneGeometry((bb.max.x - bb.min.x) * 1.16 + 10, (bb.max.z - bb.min.z) * 1.16 + 10).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ map: t, color: 0x000000, transparent: true, opacity: 0.75, depthWrite: false }));
    sh.position.set((bb.min.x + bb.max.x) / 2, 0.06, (bb.min.z + bb.max.z) / 2);
    scene.add(sh);
  }
}
const cam = camera(frame);
lights(frame);
{
  const d = cam.position.distanceTo(new THREE.Vector3(...frame.target));
  scene.fog = new THREE.Fog('#0c0b0a', d * 1.2, d * 2.6);
}
// Everything in one group: the reflection pass draws it mirrored in the floor.
const root = new THREE.Group();
[...scene.children].forEach(c => root.add(c));
scene.add(root);
// The passes (render.py composes them): the picture, its reflection in the floor, the floor's mask
// (where the reflection shows), the glow of the LED and the fire, and the mirror's reflection and mask.
const BLACK = new THREE.MeshBasicMaterial({ color: 0x000000 });
const WHITE = new THREE.MeshBasicMaterial({ color: 0xffffff });
function withMaterials(pick, fn) {
  const saved = [];
  root.traverse(o => { if (o.isMesh) { saved.push([o, o.material, o.visible]); const m = pick(o); if (m === null) o.visible = false; else o.material = m; } });
  try { return fn(); } finally { saved.forEach(([o, m, v]) => { o.material = m; o.visible = v; }); }
}
function shot() { renderer.render(scene, cam); return renderer.domElement.toDataURL('image/png'); }
window.__pass = name => {
  const bg = scene.background, fog = scene.fog;
  try {
    if (name === 'main') return shot();
    scene.background = new THREE.Color(0x000000); scene.fog = null;
    if (name === 'refl') {
      root.scale.y = -1; if (floorMesh) floorMesh.visible = false;
      try { return shot(); } finally { root.scale.y = 1; if (floorMesh) floorMesh.visible = true; }
    }
    if (name === 'mask') return withMaterials(o => (o === floorMesh ? WHITE : o.material.transparent ? null : BLACK), shot);
    if (name === 'mrefl' || name === 'mmask') {
      const mir = frame.mirror;
      if (!mir) return null;
      if (name === 'mmask') return withMaterials(o => (o === mir.mesh ? WHITE : o.material.transparent ? null : BLACK), shot);
      // the world mirrored in the glass's plane; what is behind the glass (the wall, the halo) left out,
      // what the mirror sees (the room behind the camera) shown for this pass only
      const hidden = [], shown = [];
      root.traverse(o => {
        if (!o.isMesh || !o.visible) return;
        const b = new THREE.Box3().setFromObject(o);
        if (o === mir.mesh || mir.hide.includes(o) || b.max.z <= mir.plane + 0.01) { hidden.push(o); o.visible = false; }
      });
      (mir.show || []).forEach(o => { if (!o.visible) { o.visible = true; shown.push(o); } });
      root.scale.z = -1; root.position.z = 2 * mir.plane;
      root.updateMatrixWorld(true);
      try { return shot(); } finally {
        root.scale.z = 1; root.position.z = 0; root.updateMatrixWorld(true);
        hidden.forEach(o => { o.visible = true; });
        shown.forEach(o => { o.visible = false; });
      }
    }
    if (name === 'glow') return withMaterials(o => (o.userData.glow ? o.material : o.material.transparent ? null : BLACK), shot);
  } finally { scene.background = bg; scene.fog = fog; }
};
await Promise.race([Promise.all(pending), new Promise(r => setTimeout(() => { window.__errors.push('stone photos not loaded in 15 s'); r(); }, 15000))]);
await new Promise(r => setTimeout(r, 100));
renderer.render(scene, cam);
renderer.render(scene, cam);
window.__done = true;
</script>
